# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "alium"
defaultAppearance = "dark" # valid options: light or dark
autoSwitchAppearance = true

enableA11y = false
enableSearch = true
enableCodeCopy = true

# disable to use native scrollbar style (defaults to true)
enableStyledScrollbar = true
enableStructuredBreadcrumbs = true

replyByEmail = false

# The sections that should be displayed in the recent articles list
mainSections = ["posts"]
# robots = ""

disableImageOptimization = false
disableImageOptimizationMD = false
disableTextInHeader = false
# backgroundImageWidth = 1200

# used as default for background images
defaultBackgroundImage = "img/poster_history.jpg"
# used as default for featured images in all articles
defaultFeaturedImage = "/img/featured.jpg"
# used as default for social media sharing (Open Graph and Twitter)
defaultSocialImage = "/android-chrome-512x512.png"
hotlinkFeatureImage = false
# Thumbnail aspect ratio as a number (e.g., "1.5", "1.0", "1.777")
# thumbnailAspectRatio = "1.5"
# imagePosition = "50% 50%"

highlightCurrentMenuArea = true
smartTOC = true
smartTOCHideUnfocusedChildren = false

fingerprintAlgorithm = "sha512" # Valid values are "sha512" (default), "sha384", "sha256"

giteaDefaultServer = "https://git.fsfe.org"
forgejoDefaultServer = "https://v11.next.forgejo.org"

[languageRedirect]
    # Enable client-side language redirects for multilingual sites.
    enabled = true
    # localStorage key for manual language selections.
    storageKey = "alium_blog_lang"
    # Language to use when no browser language matches. Defaults to Hugo's default content language.
    fallbackLanguage = "en"
    # Restrict browser-language redirects to home pages.
    browserRedirectHomeOnly = true
    # Redirect to the stored language when a matching translation exists.
    storedLanguageRedirect = true

[seo]
    # Controls the fallback order for the HTML meta description.
    # Valid values are "summary", "description", and "site".
    metaDescriptionOrder = ["summary", "description", "site"]

[header]
    layout = "fixed" # valid options: basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur

[footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

[homepage]
    layout = "background" # valid options: page, profile, hero, card, background, custom
    homepageImage = "img/posters/alium_2025.jpeg" # used in: hero, and card
    showRecent = true
    showRecentItems = 6
    showMoreLink = false
    showMoreLinkDest = "/posts/"
    cardView = true
    cardViewScreenWidth = false
    layoutBackgroundBlur = true # only used when layout equals background
    disableHeroImageFilter = false # only used when layout equals hero

[article]
    showDate = true

    showViews = true
    showLikes = false

    showBreadcrumbs = true
    showDraftLabel = true

    showDateOnlyInArticle = false
    showDateUpdated = false

    showAuthor = true
    showAuthorBottom = false

    showHero = true
    heroStyle = "background" # valid options: basic, big, background, thumbAndBackground
    layoutBackgroundBlur = true # only used when heroStyle equals background or thumbAndBackground
    layoutBackgroundHeaderSpace = true # only used when heroStyle equals background

    showEdit = true
    editAppendPath = true
    editURL = "https://github.com/The-Alium/blog/edit/main/content/"

    seriesOpened = false
    showHeadingAnchors = true

    showPagination = true
    invertPagination = false

    showReadingTime = true
    showRelatedContent = true
    relatedContentLimit = 6
    showTableOfContents = false

    # Enable the display of taxonomies for the related article.
    showTaxonomies = true

    # These will show if showTaxonomies is true.
    showCategories = true

    # This will change the color of category badges, so the user can better distinguish between the two. Only if showTaxonomies is true.
    showCategoriesInSecondaryColor = true

    # These will show if showTaxonomies is true.
    showTags = true

    showAuthorsBadges = true
    showWordCount = true

    sharingLinks = [ "linkedin", "twitter", "bluesky", "mastodon", "reddit", "pinterest", "facebook", "email", "whatsapp", "telegram", "line"]
    showZenMode = false

    # force external links to opne in new tab of the browser (defaults to true)
    externalLinkForceNewTab = true

[list]
    showHero = true
    heroStyle = "background" # valid options: basic, big, background, thumbAndBackground
    layoutBackgroundBlur = true # only used when heroStyle equals background or thumbAndBackground
    layoutBackgroundHeaderSpace = false # only used when heroStyle equals background
    showBreadcrumbs = false
    showSummary = false
    showViews = false
    showLikes = false
    showTableOfContents = true
    showCards = true
    orderByWeight = false
    groupByYear = true
    cardView = true
    cardViewScreenWidth = false
    constrainItemsWidth = false

[sitemap]
    excludedKinds = ["taxonomy", "term"]

[taxonomy]
    showTermCount = true
    showHero = true
    # valid options: basic, big, background, thumbAndBackground
    heroStyle = "background"
    # only used when heroStyle equals background or thumbAndBackground
    layoutBackgroundBlur = true
    # only used when heroStyle equals background
    layoutBackgroundHeaderSpace = true
    showBreadcrumbs = false
    showViews = false
    showLikes = false
    showTableOfContents = false
    cardView = true

[term]
    showHero = true
    # valid options: basic, big, background, thumbAndBackground
    heroStyle = "background"
    # only used when heroStyle equals background or thumbAndBackground
    layoutBackgroundBlur = true
    # only used when heroStyle equals background
    layoutBackgroundHeaderSpace = true
    showBreadcrumbs = false
    showViews = false
    showLikes = false
    showTableOfContents = true
    groupByYear = false
    cardView = true
    cardViewScreenWidth = false

